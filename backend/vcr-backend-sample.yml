project:
  name: epic-call-app-backend
instance:
  name: dev
  runtime: nodejs22
  region: aws.use1
  application-id: XXXX
  environment:
    - name: FRONTEND_URL
      value: "YOUR_FRONTEND_URL_HERE"
    - name: MASTER_API_KEY
      value: "YOUR_MASTER_API_KEY_HERE"
    - name: MASTER_API_SECRET_KEY
      value: "YOUR_MASTER_API_SECRET_HERE"
  entrypoint:
    - node
    - index.js
debug:
  name: debug
  application-id: XXXX
  entrypoint:
    - nodemon
    - --inspect
    - index.js
